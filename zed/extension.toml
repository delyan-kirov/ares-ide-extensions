id = "ares"
name = "Ares"
version = "0.1.0"
schema_version = 1
authors = ["Delyan Kirov"]
description = "Ares: diagnostics, fixes, hover, completion and formatting from `ares lsp`"
repository = "https://github.com/delyan-kirov/Ares"

[language_servers.ares]
name = "Ares"
languages = ["Ares"]

# Zed fetches the grammar with git at `rev` and compiles `path`/src/parser.c:
# the post-commit hook points `rev` at each commit that changes the grammar, in
# a commit of its own.
[grammars.ares]
repository = "https://github.com/delyan-kirov/ares-ide-extensions"
rev = "319cb1e3de5efa4174b5ce052c7e2321b3208028"
path = "tree-sitter-ares"
